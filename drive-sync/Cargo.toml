[package]
name = "gc-drive-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "GateControl Drive: Dateien bei Bedarf im Windows-Explorer (Cloud Files API)"
license = "MIT"
publish = false

[[bin]]
name = "gc-drive-sync"
path = "src/main.rs"

[lib]
name = "gc_drive_sync"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_CloudFilters",
  "Win32_Storage_FileSystem",
  "Win32_System_CorrelationVector",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Security_Cryptography",
  "Win32_UI_Shell",
  "Foundation",
  "Foundation_Collections",
  "Storage",
  "Storage_Provider",
  "Storage_Search",
  "Storage_Streams",
] }
windows-core = "0.62"

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1"
